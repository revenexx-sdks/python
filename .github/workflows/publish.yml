name: Publish to PyPI
on:
  release:
    types: [published]
  workflow_dispatch:

# Tokenless publishing via PyPI OIDC trusted publishing — no stored API token.
# Configure a trusted publisher for this package on PyPI once
# (https://docs.pypi.org/trusted-publishers/), pointing at this repo + workflow.
permissions:
  id-token: write
  contents: read

jobs:
  publish:
    name: Release build and publish
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Build package
        run: |
          python -m pip install build
          python -m build

      - name: Publish package
        uses: pypa/gh-action-pypi-publish@release/v1
